    <g transform="translate(24 48)"><rect width="264" height="122" rx="14" fill="#111D33" stroke="#233854"/><text x="18" y="58" fill="#61D6C6" font-size="30" font-weight="700">5+ years</text><text x="18" y="85" fill="#8C9CB3" font-size="14">building data systems</text></g>
