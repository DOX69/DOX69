<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Mickaël Rakotoarinivo, Data Engineer</title>
  <desc id="desc">A governed data pipeline flows from ingest to transform and deliver, producing analytics, AI, and data products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A1324"/>
      <stop offset="1" stop-color="#0D1930"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop stop-color="#61D6C6"/>
      <stop offset=".55" stop-color="#71A7FF"/>
      <stop offset="1" stop-color="#9E83FF"/>
    </linearGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#182842" stroke-width="1" opacity=".62">
    <path d="M0 320H1200M0 360H1200M540 0V400M660 0V400M780 0V400M900 0V400M1020 0V400M1140 0V400"/>
  </g>
  <path d="M540 28V372" stroke="#21334E" stroke-width="1"/>

  <g id="identity">
    <rect x="48" y="40" width="218" height="30" rx="15" fill="#111E34" stroke="#2A4362"/>
    <circle cx="65" cy="55" r="4" fill="#61D6C6"/>
    <text x="79" y="60" fill="#B8C7DA" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">AVAILABLE · SUISSE ROMANDE</text>
    <text x="48" y="132" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="38" font-weight="700">Mickaël Rakotoarinivo</text>
    <text x="48" y="175" fill="#61D6C6" font-family="Arial, sans-serif" font-size="24" font-weight="700">Data Engineer</text>
    <text x="48" y="225" fill="#AFC0D6" font-family="Arial, sans-serif" font-size="18">Building governed data systems,</text>
    <text x="48" y="252" fill="#AFC0D6" font-family="Arial, sans-serif" font-size="18">from ingestion to intelligent delivery.</text>
  </g>

  <g id="motion-governance">
    <rect x="565" y="274" width="607" height="72" rx="12" fill="#101D33" stroke="#294261"/>
    <path d="M566 275H1171" stroke="url(#flow)" stroke-width="2"/>
    <path d="M586 298L594 294L602 298V306C602 313 596 317 594 318C592 317 586 313 586 306Z" fill="none" stroke="#61D6C6" stroke-width="2" stroke-linejoin="round"/>
    <text x="615" y="305" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="13" font-weight="700">GOVERNANCE</text>
    <text x="615" y="328" fill="#91A4BD" font-family="Arial, sans-serif" font-size="12" letter-spacing=".65">QUALITY · SECURITY · LINEAGE</text>
    <circle cx="1125" cy="310" r="4" fill="#61D6C6"/>
    <circle cx="1143" cy="310" r="4" fill="#71A7FF"/>
    <circle cx="1161" cy="310" r="4" fill="#9E83FF"/>
  </g>

  <g id="motion-ingest">
    <rect x="565" y="103" width="120" height="94" rx="12" fill="#111F36" stroke="#31506F"/>
    <path d="M625 116V132M619 126L625 132L631 126M617 137H633" fill="none" stroke="#61D6C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="625" y="160" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="14" font-weight="700">INGEST</text>
    <text x="625" y="182" text-anchor="middle" fill="#91A4BD" font-family="Arial, sans-serif" font-size="12">Collect</text>
  </g>
  <g id="motion-flow-ingest-transform">
    <path d="M685 150H719" fill="none" stroke="#4A6688" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="motion-transform">
    <rect x="719" y="103" width="142" height="94" rx="12" fill="#111F36" stroke="#31506F"/>
    <path d="M780 119H800M780 127H800M780 135H800" stroke="#71A7FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="786" cy="119" r="3" fill="#0D1930" stroke="#71A7FF" stroke-width="2"/>
    <circle cx="795" cy="127" r="3" fill="#0D1930" stroke="#71A7FF" stroke-width="2"/>
    <circle cx="784" cy="135" r="3" fill="#0D1930" stroke="#71A7FF" stroke-width="2"/>
    <text x="790" y="160" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="14" font-weight="700">TRANSFORM</text>
    <text x="790" y="182" text-anchor="middle" fill="#91A4BD" font-family="Arial, sans-serif" font-size="12">Model</text>
  </g>
  <g id="motion-flow-transform-deliver">
    <path d="M861 150H895" fill="none" stroke="#4A6688" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="motion-deliver">
    <rect x="895" y="103" width="124" height="94" rx="12" fill="#111F36" stroke="#31506F"/>
    <path data-icon="package" d="M947 121L957 116L967 121V134L957 140L947 134ZM947 121L957 127L967 121M957 127V140" fill="none" stroke="#9E83FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="957" y="160" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="14" font-weight="700">DELIVER</text>
    <text x="957" y="182" text-anchor="middle" fill="#91A4BD" font-family="Arial, sans-serif" font-size="12">Serve</text>
  </g>
  <g id="motion-output-flow">
    <path d="M1019 150H1026V80M1026 150V220M1026 80H1036M1026 150H1036M1026 220H1036" fill="none" stroke="#3D5879" stroke-width="2"/>
  </g>
  <g id="motion-output-analytics">
    <rect x="1036" y="50" width="132" height="60" rx="10" fill="#102238" stroke="#31506F"/>
    <path d="M1094 76V65M1102 76V60M1110 76V68" stroke="#61D6C6" stroke-width="2" stroke-linecap="round"/>
    <text x="1102" y="97" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="12" font-weight="700">ANALYTICS</text>
  </g>
  <g id="motion-output-ai">
    <rect x="1036" y="120" width="132" height="60" rx="10" fill="#102238" stroke="#31506F"/>
    <path d="M1096 137L1108 151M1108 137L1096 151" stroke="#71A7FF" stroke-width="1.5"/>
    <circle cx="1096" cy="137" r="3" fill="#71A7FF"/><circle cx="1108" cy="137" r="3" fill="#71A7FF"/><circle cx="1096" cy="151" r="3" fill="#71A7FF"/><circle cx="1108" cy="151" r="3" fill="#71A7FF"/>
    <text x="1102" y="167" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="12" font-weight="700">AI</text>
  </g>
  <g id="motion-output-data-products">
    <rect x="1036" y="190" width="132" height="60" rx="10" fill="#102238" stroke="#31506F"/>
    <ellipse cx="1102" cy="204" rx="9" ry="4" fill="none" stroke="#9E83FF" stroke-width="1.5"/>
    <path d="M1093 204V219C1093 222 1097 224 1102 224C1107 224 1111 222 1111 219V204M1093 212C1093 215 1097 217 1102 217C1107 217 1111 215 1111 212" fill="none" stroke="#9E83FF" stroke-width="1.5"/>
    <text x="1102" y="237" text-anchor="middle" fill="#F5F8FC" font-family="Arial, sans-serif" font-size="12" font-weight="700">DATA PRODUCTS</text>
  </g>
</svg>
